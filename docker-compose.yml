version: '3.8'

services:
  # TypeScript Express Backend
  backend:
    build:
      context: ./SatQuerAI-Backend
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/satquery_ai?schema=public
      - COLAB_MODEL_URL=${COLAB_MODEL_URL:-http://model-server:8000}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      - postgres
    restart: always

  # Vite React Frontend
  frontend:
    build:
      context: ./SatQueryAI-Frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:5001
    depends_on:
      - backend
    restart: always

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: satquery_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: satquery_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
